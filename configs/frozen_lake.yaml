training:
  log_interval: 100
  max_steps_per_episode: 100
  num_episodes: 4000
  save_interval: 500
  speed: 10000000

testing:
  num_episodes: 3000
  speed: 10000000

reward:
  goal: 1.0
  hole: 0.0
  wall: -0.1
  ice: -0.05

agent:
  # DDQN or PPO
  rl_type: transformer

  # MLP or CNN
  model_type: CNN

  #ddqn specific
  epsilon_decay: 2000
  epsilon_end: 0.01
  epsilon_start: 1.0
  target_update_freq: 10
  gamma_ddqn: 0.99
  learning_rate_ddqn: 0.0005

  # PPO-specific
  clip_epsilon: 0.2
  ppo_epochs: 6
  entropy_coeff: 0.01
  gae_lambda: 0.95
  gamma_ppo: 0.99
  learning_rate_ppo: 0.0003

  transformer:
    input_dim: 36 #[4x3x3]
    seq_len: 10
    d_model: 128
    num_heads: 4
    hidden_dim: 256

  mlp:
    hidden_size: 128

  cnn:
    hidden_size: 512
    input_shape: [4, 3, 3] #[channels, height, width]
    conv_channels: 16

env:
  slip: [1, 0, 0]  # forward, left, right relative probabilities to intended
  map_size: 4
  goal: 0.7
  hole: 0
  ice: 0
  agent: 1

memory:
  batch_size: 64
  buffer_size: 10000